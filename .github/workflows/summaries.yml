name: Update summaries

# Every hour, regenerate summaries/ from the loom-fun Hugging Face org and, when a model was added, updated or
# removed, rebuild website/assets/loom-data.js and push both straight to main.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-summaries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Regenerate summaries
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python summarize_info.py --skip-unusable

      - name: Check for changes
        id: diff
        run: |
          git add -A summaries
          if git diff --cached --quiet -- summaries; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No model changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- summaries
          fi

      - name: Rebuild website data
        if: steps.diff.outputs.changed == 'true'
        run: python website/build_data.py

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A summaries website/assets/loom-data.js
          git commit -m "Update summaries from the loom-fun org" -m "$(git diff --cached --name-status -- summaries)"
          git pull --rebase origin main
          git push origin HEAD:main
